name: small_school_management
description: A complete school management system for small schools - attendance, fees, timetable, exams, report cards, WhatsApp reports, and OTA updates.
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.3.3
  path_provider: ^2.1.2
  path: ^1.9.0
  url_launcher: ^6.3.1
  share_plus: ^13.3.1
  pdf: ^3.11.0
  printing: ^5.15.1
  intl: ^0.18.1
  equatable: ^2.0.5
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  lottie: ^3.1.0
  http: ^1.2.2
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
